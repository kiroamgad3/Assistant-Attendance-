<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistants Attendance</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#76746c;--line:#e4e1d8;--acc:#0f6b5c;--accink:#fff;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#201f1d;--ink:#f1efe8;--mute:#9b988d;--line:#34322e;--acc:#4cc2ac;--accink:#06231d;--bad:#f2b8b5}}
:root[data-theme="dark"]{--bg:#151514;--card:#201f1d;--ink:#f1efe8;--mute:#9b988d;--line:#34322e;--acc:#4cc2ac;--accink:#06231d;--bad:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.brand{display:flex;align-items:center;gap:10px}.logo{height:44px;width:auto}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:6px 0 12px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:10px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:inherit;font-weight:600}
.btn.o{background:none;border:1px solid var(--acc);color:var(--acc);margin-top:8px}
.sm{padding:6px 10px;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;font-size:13px}
.sm.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.mute{color:var(--mute);font-size:13px}.big{font-size:22px;font-weight:700}.two{display:flex;gap:8px}.two>*{flex:1}
.msg{padding:30px 10px;text-align:center;color:var(--mute)}.det{background:var(--bg);border-radius:10px;padding:10px;margin:0 0 8px}
</style></head><body><main>

const put=(c,id,v,merge)=>{(D[c]=D[c]||{})[id]=merge?{...D[c][id],...v}:{...v};save();fire(c)};

const nm=id=>(assistants.find(a=>a.id===id)||{name:t('gone')}).name;
$('#view').innerHTML=`<div class="card"><div class="two"><div><label>${t('date')}</label><input type="date" id="d" value="${form.date}"></div>
<div><label>${t('centre')}</label><select id="c">${cs.map(c=>`<option ${c===form.centre?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
<label>${t('cls')}</label><input id="l" value="${esc(form.label)}">
<label>${t('who')}</label><div class="chips">${pool.map(a=>`<button class="chip ${form.ids.includes(a.id)?'on':''}" data-a="${a.id}">${esc(a.name)}</button>`).join('')}</div>
<button class="btn" id="save">${form.edit?t('upd'):t('save')}</button>${form.edit?`<button class="btn o" id="cx">${t('cancel')}</button>`:''}</div>
<div class="card"><b>${t('recent')}</b>${recent.length?recent.map(s=>`<div class="row"><div><div>${esc(s.date)} · ${esc(s.centre)}${s.label?' · '+esc(s.label):''}${isLocked(s.date)?' 🔒':''}</div><div class="mute">${(s.ids||[]).map(i=>esc(nm(i))).join(', ')||'—'}</div></div><div style="display:flex;gap:6px"><button class="sm" data-ed="${s.id}">${t('edit')}</button><button class="sm bad" data-del="${s.id}">${t('del')}</button></div></div>`).join(''):`<div class="mute" style="margin-top:8px">${t('none')}</div>`}</div>`;
$('#d').onchange=e=>form.date=e.target.value;$('#c').onchange=e=>{form.centre=e.target.value;form.ids=[];render()};$('#l').oninput=e=>form.label=e.target.value;
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=b.dataset.a;form.ids=form.ids.includes(i)?form.ids.filter(x=>x!==i):[...form.ids,i];vRec()});
if($('#cx'))$('#cx').onclick=()=>{form={date:today(),centre:form.centre,label:'',ids:[],edit:null};render()};
$('#save').onclick=async()=>{if(!form.date||!form.ids.length)return toast(t('pick'));
const old=form.edit&&sessions.find(s=>s.id===form.edit);if(isLocked(form.date)||(old&&isLocked(old.date)))return toast(t('locked'));
const data={date:form.date,centre:form.centre,label:form.label,ids:form.ids};
try{if(form.edit)await db.doc('sessions/'+form.edit).update(data);else await db.collection('sessions').add({...data,t:Date.now()});form={date:form.date,centre:form.centre,label:'',ids:[],edit:null};toast(t('saved'));render()}catch(e){fail(e)}};
document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const s=sessions.find(x=>x.id===b.dataset.ed);if(isLocked(s.date))return toast(t('locked'));form={date:s.date,centre:s.centre,label:s.label||'',ids:[...(s.ids||[])],edit:s.id};render();scrollTo(0,0)});
document.querySelectorAll('[data-del]').forEach(b=>armed(b,async()=>{const s=sessions.find(x=>x.id===b.dataset.del);if(isLocked(s.date))return toast(t('locked'));try{await db.doc('sessions/'+s.id).delete()}catch(e){fail(e)}}))}
let pf={date:today(),centre:'',label:'',time:''},asg=null,asgIds=[];
function vPlan(){
const cs=centres();if(!cs.length){$('#view').innerHTML=`<div class="card msg">${t('first')}</div>`;return}
if(!cs.includes(pf.centre))pf.centre=cs[0];
const nm=id=>(assistants.find(a=>a.id===id)||{name:t('gone')}).name,td=today(),d=new Date(Date.now()+864e5),tms=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const up=sessions.filter(s=>s.status==='planned').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const need=up.filter(s=>s.date===tms&&!(s.ids||[]).length).length;
$('#view').innerHTML=`<div class="card"><div class="two"><div><label style="margin-top:0">${t('date')}</label><input type="date" id="pd" value="${pf.date}"></div><div><label style="margin-top:0">${t('time')}</label><input type="time" id="pt" value="${pf.time}"></div></div>
<label>${t('centre')}</label><select id="pc">${cs.map(c=>`<option ${c===pf.centre?'selected':''}>${esc(c)}</option>`).join('')}</select>
<label>${t('cls')}</label><input id="pl" value="${esc(pf.label)}"><button class="btn" id="pa">${t('addCls')}</button></div>
${need?`<div class="card" style="border-color:var(--bad)"><b>⚠ ${need} ${t('need')}</b></div>`:''}
<b>${t('upcoming')}</b><div style="margin-top:8px">${up.length?up.map(s=>{const ids=s.ids||[],pool=assistants.filter(a=>a.centre===s.centre),bd=s.date===td?t('tdy'):s.date===tms?t('tmr'):s.date<td?t('over'):'';
return `<div class="card"><b>${esc(s.date)}${s.time?' · '+esc(s.time):''}</b> ${bd?`<span class="mute">· ${bd}</span>`:''}<div>${esc(s.centre)}${s.label?' · '+esc(s.label):''}</div><div class="mute">${ids.length?ids.map(i=>esc(nm(i))).join(', '):t('unas')}</div>
${asg===s.id?`<div class="chips">${pool.map(a=>`<button class="chip ${asgIds.includes(a.id)?'on':''}" data-pc="${a.id}">${esc(a.name)}</button>`).join('')}</div><button class="btn" id="ps">${t('save')}</button>`:''}
<div class="two" style="margin-top:10px"><button class="sm" data-as="${s.id}">${t('choose')}</button><button class="sm" data-ok="${s.id}">${t('att')}</button><button class="sm bad" data-pd="${s.id}">${t('del')}</button></div></div>`}).join(''):`<div class="mute">${t('noUp')}</div>`}</div>`;
$('#pd').onchange=e=>pf.date=e.target.value;$('#pt').onchange=e=>pf.time=e.target.value;$('#pc').onchange=e=>pf.centre=e.target.value;$('#pl').oninput=e=>pf.label=e.target.value;
$('#pa').onclick=async()=>{if(!pf.date)return toast(t('pick'));if(isLocked(pf.date))return toast(t('locked'));try{await db.collection('sessions').add({date:pf.date,time:pf.time,centre:pf.centre,label:pf.label,ids:[],status:'planned',t:Date.now()});pf.label='';toast(t('ok'));render()}catch(e){fail(e)}};
document.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{const s=sessions.find(x=>x.id===b.dataset.as);asg=asg===s.id?null:s.id;asgIds=[...(s.ids||[])];vPlan()});
document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{const i=b.dataset.pc;asgIds=asgIds.includes(i)?asgIds.filter(x=>x!==i):[...asgIds,i];vPlan()});
if($('#ps'))$('#ps').onclick=async()=>{const s=sessions.find(x=>x.id===asg);if(isLocked(s.date))return toast(t('locked'));try{await db.doc('sessions/'+asg).update({ids:asgIds});asg=null;toast(t('ok'));render()}catch(e){fail(e)}};
document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const s=sessions.find(x=>x.id===b.dataset.ok);if(!(s.ids||[]).length)return toast(t('unas'));if(isLocked(s.date))return toast(t('locked'));try{await db.doc('sessions/'+s.id).update({status:'done'});toast(t('ok'))}catch(e){fail(e)}});
document.querySelectorAll('[data-pd]').forEach(b=>armed(b,async()=>{try{await db.doc('sessions/'+b.dataset.pd).delete()}catch(e){fail(e)}}))}
let ef={date:today(),key:'',exam:'',marks:'',n:''};
const rt=m=>m<=35?rates.a:m<=65?rates.b:rates.c;
function vEx(){
const names=[...new Map(assistants.map(a=>[a.name.trim().toLowerCase(),a.name])).entries()];
if(!names.length){$('#view').innerHTML=`<div class="card msg">${t('first')}</div>`;return}
if(!names.some(n=>n[0]===ef.key))ef.key=names[0][0];
const nm=k=>(names.find(n=>n[0]===k)||[0,t('gone')])[1];
const recent=papers.slice().sort((a,b)=>(b.date+b.t).localeCompare(a.date+a.t)).slice(0,15);
const pv=()=>ef.marks!==''&&ef.n!==''?ef.n+' × '+rt(Number(ef.marks))+' = '+Math.round(ef.n*rt(Number(ef.marks))*100)/100:'';
$('#view').innerHTML=`<div class="card"><div class="two"><div><label style="margin-top:0">${t('date')}</label><input type="date" id="ed" value="${ef.date}"></div><div><label style="margin-top:0">${t('asst')}</label><select id="ek">${names.map(n=>`<option value="${esc(n[0])}" ${n[0]===ef.key?'selected':''}>${esc(n[1])}</option>`).join('')}</select></div></div>
<label>${t('exName')}</label><input id="en" value="${esc(ef.exam)}">
<div class="two"><div><label>${t('marks')}</label><input id="em" type="number" inputmode="decimal" value="${ef.marks}"></div><div><label>${t('np')}</label><input id="ep" type="number" inputmode="numeric" value="${ef.n}"></div></div>
<div class="big" id="pv" style="margin-top:10px">${pv()}</div><button class="btn" id="ea">${t('add')}</button></div>
<div class="card"><b>${t('recent')}</b>${recent.length?recent.map(p=>`<div class="row"><div><div>${esc(p.date)} · ${esc(nm(p.key))}${isLocked(p.date)?' 🔒':''}</div><div class="mute">${esc(p.exam||'')} ${p.n} ${t('papers')} × ${p.r} (${p.marks}) = ${Math.round(p.n*p.r*100)/100}</div></div><button class="sm bad" data-dp="${p.id}">${t('del')}</button></div>`).join(''):`<div class="mute" style="margin-top:8px">${t('none')}</div>`}</div>
<div class="card"><b>${t('rt')}</b><div class="two"><div><label>${t('r1')}</label><input type="number" data-rt="a" value="${rates.a}"></div><div><label>${t('r2')}</label><input type="number" data-rt="b" value="${rates.b}"></div><div><label>${t('r3')}</label><input type="number" data-rt="c" value="${rates.c}"></div></div></div>`;
$('#ed').onchange=e=>ef.date=e.target.value;$('#ek').onchange=e=>ef.key=e.target.value;$('#en').oninput=e=>ef.exam=e.target.value;
$('#em').oninput=e=>{ef.marks=e.target.value;$('#pv').textContent=pv()};$('#ep').oninput=e=>{ef.n=e.target.value;$('#pv').textContent=pv()};
$('#ea').onclick=async()=>{const m=Number(ef.marks),n=Number(ef.n);if(!ef.date||!(m>0)||!(n>0))return toast(t('pickEx'));if(isLocked(ef.date))return toast(t('locked'));try{await db.collection('papers').add({date:ef.date,key:ef.key,exam:ef.exam,marks:m,n,r:rt(m),t:Date.now()});ef.exam='';ef.marks='';ef.n='';toast(t('ok'));render()}catch(e){fail(e)}};
document.querySelectorAll('[data-dp]').forEach(b=>armed(b,async()=>{const p=papers.find(x=>x.id===b.dataset.dp);if(isLocked(p.date))return toast(t('locked'));try{await db.doc('papers/'+p.id).delete()}catch(e){fail(e)}}));
document.querySelectorAll('[data-rt]').forEach(i=>i.onchange=async()=>{try{await db.doc('settings/rates').set({...rates,[i.dataset.rt]:Number(i.value)||0})}catch(e){fail(e)}})}
function calc(){
const ss=sessions.filter(s=>s.status!=='planned'&&(s.date||'').startsWith(month)),g={};
assistants.forEach(a=>{const k=a.name.trim().toLowerCase();const x=g[k]||(g[k]={k,name:a.name,n:0,pay:0,ex:0,ep:0,np:0,pp:[],dates:[],adj:[]});
ss.filter(s=>(s.ids||[]).includes(a.id)).forEach(s=>{x.n++;x.pay+=Number(a.rate)||0;x.dates.push([s.date,a.centre,s.label||''])})});
papers.filter(p=>(p.date||'').startsWith(month)).forEach(p=>{const x=g[p.key];if(x){x.ep+=Math.round(p.n*p.r*100)/100;x.np+=Number(p.n);x.pp.push(p)}});
adjs.filter(a=>a.month===month).forEach(a=>{const x=g[a.key];if(x){x.ex+=Number(a.amount)||0;x.adj.push(a)}});
return{ss,rows:Object.values(g).sort((a,b)=>a.name.localeCompare(b.name))}}
function vRep(){
const{ss,rows}=calc(),lk=locks.includes(month),sum=k=>rows.reduce((s,r)=>s+r[k],0);
$('#view').innerHTML=`<div class="card"><label style="margin-top:0">${t('month')}</label><input type="month" id="m" value="${month}">
<div class="mute" style="margin-top:8px">${ss.length} ${t('classes')}${lk?' · 🔒':''}</div>
<button class="btn o" id="lk">${lk?t('unlock'):t('lock')}</button><button class="btn o" id="dl">${t('dl')}</button></div>
<div class="card">${rows.length?rows.map(r=>`<div class="row" data-o="${esc(r.k)}" style="cursor:pointer"><div><b>${esc(r.name)}</b><div class="mute">${r.n} ${t('classes')} · ${r.pay}${r.np?' + '+r.np+' '+t('papers')+' · '+r.ep:''}${r.ex?' + '+r.ex:''}</div></div><div class="big">${r.pay+r.ep+r.ex}</div></div>
${open===r.k?`<div class="det">${r.dates.sort().map(d=>`<div class="mute">${esc(d[0])} · ${esc(d[1])} ${esc(d[2])}</div>`).join('')}
${r.pp.map(p=>`<div class="mute">${esc(p.date)} · ${p.n} ${t('papers')} × ${p.r} (${p.marks}) ${esc(p.exam||'')}</div>`).join('')}
${r.adj.map(a=>`<div class="row"><span class="mute">${a.amount>0?'+':''}${a.amount} ${esc(a.note||'')}</span><button class="sm bad" data-xa="${a.id}">${t('del')}</button></div>`).join('')}
<label>${t('adj')}</label><div class="two"><input type="number" inputmode="decimal" id="aa" placeholder="${t('amt')}"><input id="an" placeholder="${t('note')}"></div><button class="btn o" id="ad">${t('addAdj')}</button></div>`:''}`).join('')+`<div class="row"><b>${t('total')}</b><b>${sum('pay')+sum('ep')+sum('ex')}</b></div><div class="mute">${t('tap')}</div>`:`<div class="mute">${t('noA')}</div>`}</div>`;
$('#m').onchange=e=>{month=e.target.value||month;open=null;vRep()};
$('#lk').onclick=async()=>{try{lk?await db.doc('locks/'+month).delete():await db.doc('locks/'+month).set({m:month})}catch(e){fail(e)}};
$('#dl').onclick=async()=>{try{const d=await claude.use('downloads');if(!d)return toast('Unavailable');const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
const csv='\ufeff'+[T[L].h.slice(0,3).concat(t('exPay'),T[L].h.slice(3)),...rows.map(r=>[r.name,r.n,r.pay,r.ep,r.ex,r.pay+r.ep+r.ex])].map(r=>r.map(q).join(',')).join('\n');
await d.save({filename:'attendance-'+month+'.csv',data:csv})}catch(e){if(!e||e.code!=='declined')fail(e)}};
document.querySelectorAll('[data-o]').forEach(r=>r.onclick=()=>{open=open===r.dataset.o?null:r.dataset.o;vRep()});
document.querySelectorAll('[data-xa]').forEach(b=>armed(b,async()=>{if(lk)return toast(t('locked'));try{await db.doc('adjs/'+b.dataset.xa).delete()}catch(e){fail(e)}}));
if($('#ad'))$('#ad').onclick=async()=>{const v=Number($('#aa').value);if(!v)return;if(lk)return toast(t('locked'));try{await db.collection('adjs').add({key:open,month,amount:v,note:$('#an').value.trim()})}catch(e){fail(e)}}}
function vSet(){
const cs=centres();
$('#view').innerHTML=`<div class="card"><label style="margin-top:0">${t('name')}</label><input id="n">
<label>${t('centre')}</label><input id="ce" list="cl"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
<label>${t('rate')}</label><input id="r" type="number" inputmode="decimal" min="0"><div class="mute" style="margin-top:8px">${t('hint')}</div><button class="btn" id="add">${t('add')}</button></div>
<div class="card"><b>${t('assist')}</b>${assistants.length?assistants.slice().sort((a,b)=>(a.centre||'').localeCompare(b.centre||'')||a.name.localeCompare(b.name)).map(a=>`<div class="row"><div><div>${esc(a.name)}</div><div class="mute">${esc(a.centre||'')}</div></div><div style="display:flex;gap:6px;align-items:center"><input type="number" inputmode="decimal" data-r="${a.id}" value="${a.rate||''}" style="width:80px;padding:8px"><button class="sm bad" data-x="${a.id}">✕</button></div></div>`).join(''):`<div class="mute" style="margin-top:8px">${t('noA')}</div>`}</div>`;
if(window.__att){const c=document.createElement('div');c.className='card';const ar=L==='ar';c.innerHTML=`<b>${ar?'نسخة احتياطية':'Backup'}</b><div class="mute" style="margin:6px 0">${ar?'البيانات محفوظة على هذا الجهاز فقط. صدّر نسخة بانتظام.':'Data is stored on this device only. Export a backup regularly.'}</div><div class="two"><button class="btn o" id="bx" style="margin:0">${ar?'تصدير':'Export'}</button><button class="btn o" id="bi" style="margin:0">${ar?'استيراد':'Import'}</button></div><input type="file" id="bf" accept=".json" style="display:none">`;$('#view').appendChild(c);
$('#bx').onclick=async()=>{const d=await claude.use('downloads');d.save({filename:'attendance-backup-'+today()+'.json',data:__att.export()})};
$('#bi').onclick=()=>$('#bf').click();
$('#bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{__att.import(r.result);toast(t('ok'))}catch(x){toast('Invalid file')}};r.readAsText(f)}}
$('#add').onclick=async()=>{const name=$('#n').value.trim(),centre=$('#ce').value.trim();if(!name||!centre)return toast(t('pick'));try{await db.collection('assistants').add({name,centre,rate:Number($('#r').value)||0})}catch(e){fail(e)}};
document.querySelectorAll('[data-r]').forEach(i=>i.onchange=async()=>{try{await db.doc('assistants/'+i.dataset.r).update({rate:Number(i.value)||0})}catch(e){fail(e)}});
document.querySelectorAll('[data-x]').forEach(b=>armed(b,async()=>{try{await db.doc('assistants/'+b.dataset.x).delete()}catch(e){fail(e)}}))}
function keep(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.id!=='d')return;render()}
render();
(async()=>{try{db=await claude.use('db');if(!db)return render();const on=(c,f)=>db.collection(c).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));keep()},()=>{});
on('assistants',x=>assistants=x);on('sessions',x=>sessions=x);on('locks',x=>locks=x.map(l=>l.id));on('adjs',x=>adjs=x);on('papers',x=>papers=x);on('settings',x=>{const r=x.find(d=>d.id==='rates');rates=r?{a:Number(r.a)||0,b:Number(r.b)||0,c:Number(r.c)||0}:{a:5,b:10,c:15}});render()}catch(e){db=null;render()}})();
</script></body></html>
